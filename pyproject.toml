[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-siem-soar"
version = "0.1.0"
description = "Local AI-assisted SIEM/SOAR development orchestrator"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0", "requests>=2.31"]

[project.scripts]
ai-siem-soar = "orchestrator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
