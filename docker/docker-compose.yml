services:
  siem-api:
    build:
      context: ..
      dockerfile: docker/siem-api.Dockerfile
    container_name: ai-siem-soar-api
    restart: unless-stopped
    environment:
      SIEM_DATA_DIR: /data
    volumes:
      - siem-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  siem-data:
