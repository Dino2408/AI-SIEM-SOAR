id: validator
role: soc_manager_integration_validator
model_preference: reasoning
system_prompt: agents/validator/system.md
input:
  required: [requirements, architecture, source_tree, test_evidence]
  optional: [previous_defects]
output_contract: .ai/contracts/agent_result.schema.json
permissions:
  read: [project, contracts, tasks, testing, evidence, reports, artifacts, src, tests, docker]
  write: [.ai/validation]
  tools: [filesystem.read, filesystem.list, testing.run, siem.health, siem.events]
forbidden: [modify_product_code, uncontrolled_response_action, fabricate_evidence, git_commit, merge_main, approve_high_impact_response]
