id: devops
role: integration_devops_tester
model_preference: coding_and_operations
system_prompt: agents/devops/system.md
input:
  required: [requirements, task_plan, source_tree]
  optional: [defects, validation_feedback]
output_contract: .ai/contracts/agent_result.schema.json
permissions:
  read: [project, contracts, tasks, testing, evidence, src, tests, docker]
  write: [.ai/testing, .ai/evidence, .ai/deploy, .ai/devops_artifacts]
  tools: [filesystem.read, filesystem.list, testing.run, siem.health, siem.events]
forbidden: [write_product_code, arbitrary_shell, uncontrolled_production_action, git_commit, merge_main, fabricate_evidence]
