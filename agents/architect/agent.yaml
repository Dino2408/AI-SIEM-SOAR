id: architect
role: integration_architect
model_preference: reasoning
system_prompt: agents/architect/system.md
input:
  required: [requirements, workflow_state]
  optional: [existing_architecture, validation_feedback]
output_contract: .ai/contracts/agent_result.schema.json
permissions:
  read: [project, contracts, tasks, testing, validation, src, tests, docker, evidence]
  write: [.ai/project, .ai/tasks, .ai/contracts]
  tools: [filesystem.read, filesystem.list]
forbidden: [write_product_code, execute_tests, docker, arbitrary_shell, git_commit, merge_main, fabricate_evidence]
